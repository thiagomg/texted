name: Build Ubuntu 26.04

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Ubuntu 26.04 x86_64
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      RUST_TOOLCHAIN: stable
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential ca-certificates curl pkg-config libssl-dev

      - name: Test, build, and package
        run: bash .github/scripts/build-linux.sh ubuntu-26.04-x86_64

      - name: Upload release binaries
        uses: actions/upload-artifact@v7
        with:
          name: texted-ubuntu-26.04-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
