name: Build Fedora 32

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Fedora 32 x86_64
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      # Run JavaScript actions on the host; compile and test inside Fedora 32.
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare Fedora 32 build environment
        run: docker build --platform linux/amd64 --tag texted-fedora32 --file .github/docker/fedora-32.Dockerfile .github/docker

      - name: Test, build, and package inside Fedora 32
        run: |
          mkdir -p dist
          docker run --rm --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$GITHUB_WORKSPACE/dist:/artifacts" \
            --workdir /workspace \
            --env RUST_TOOLCHAIN=stable \
            --env CARGO_TERM_COLOR=always \
            --env CARGO_TARGET_DIR=/tmp/texted-target \
            --env ARTIFACT_DIR=/artifacts \
            texted-fedora32 \
            bash .github/scripts/build-linux.sh fedora-32-x86_64

      - name: Upload release binaries
        uses: actions/upload-artifact@v7
        with:
          name: texted-fedora-32-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
